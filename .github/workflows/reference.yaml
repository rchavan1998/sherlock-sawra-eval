jobs:
  tox-lint:
    # Linting is ran through tox to ensure that the same linter is used by local runners

    # >>> USE MATRIX
    # runs-on: ubuntu-latest
    runs-on: ${{ matrix.os }}

    # >>> USE MATRIX
    strategy:
      matrix:
        os: [ubuntu-latest]
        # >>> REPLACE PYVERSION
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v4

      # >>> IS IDENTIFIER
      # - name: Set up linting environment
      - uses: actions/setup-python@v5
        with:
          # >>> USE MATRIX
          # python-version: '3.x'
          python-version: ${{ matrix.python-version }}

      # >>> IS IDENTIFIER
      # - name: Install tox and related dependencies
      - run: |
          python -m pip install --upgrade pip
          pip install tox

      # >>> IS IDENTIFIER
      # - name: Run tox linting environment
      - run: tox -e lint

  tox-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # We want to know what specicic versions it fails on
      matrix:
        os: [
          ubuntu-latest,
          windows-latest,
          macos-latest,
        ]
        python-version: [
          '3.9',
          '3.10',
          '3.11',
          '3.12',
        ]
    steps:
      - uses: actions/checkout@v4

      # >>> IS IDENTIFIER
      # - name: Set up environment ${{ matrix.python-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
        
      # >>> IS IDENTIFIER
      # - name: Install tox and related dependencies
      - run: |
          python -m pip install --upgrade pip
          pip install tox
          pip install tox-gh-actions
      
      # >>> IS IDENTIFIER
      # - name: Run tox
      - run: tox
